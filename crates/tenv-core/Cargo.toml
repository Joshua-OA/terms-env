[package]
name = "tenv-core"
description = "Core library for terms-env: vault, crypto, and transport logic"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
crc32fast = "1"
dirs = "5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
iroh = "1.0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spake2 = "0.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[dev-dependencies]
ed25519-dalek = "2"
tempfile = "3.27.0"

# keyring v3 ships a no-persistence mock unless a platform backend feature is
# enabled. Opt in per OS; see docs/learnings03.md stage 7 incident #6.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# libsecret via dbus; needs libdbus-1-dev + pkg-config when building from source.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
